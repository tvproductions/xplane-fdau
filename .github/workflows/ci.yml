name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12
      - run: uv run --python 3.12 python tools/quality.py check

  compatibility:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12
      - run: uv run --python 3.12 python -m unittest discover -v

  artifacts:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12
      - run: uv build --no-sources
      - run: uv tool run twine@7.0.0 check --strict dist/*
      - run: uv run --python 3.12 python tools/release.py check-dist dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: distribution
          path: |
            dist/xplane_fdau-0.1.0-py3-none-any.whl
            dist/xplane_fdau-0.1.0.tar.gz
          if-no-files-found: error

  installed-wheel:
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv python install 3.12
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distribution
          path: dist
      - run: uv venv "$RUNNER_TEMP/xplane-fdau-smoke" --python 3.12
      - run: uv pip install --python "$RUNNER_TEMP/xplane-fdau-smoke/bin/python" dist/xplane_fdau-0.1.0-py3-none-any.whl
      - run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/xplane-fdau-smoke/bin/python" "$GITHUB_WORKSPACE/tools/installed_smoke.py" 0.1.0
