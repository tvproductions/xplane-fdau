name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12.16"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --all-groups
      - run: uv run --locked --all-groups python tools/quality.py check

  artifacts:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12.16"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --all-groups
      - run: uv build --no-sources
      - run: uv run --locked --all-groups twine check --strict dist/*
      - run: uv run --locked --all-groups python tools/release.py check-dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution
          path: |
            dist/xplane_fdau-0.1.0-py3-none-any.whl
            dist/xplane_fdau-0.1.0.tar.gz
          if-no-files-found: error

  installed-wheel:
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12.16"
          enable-cache: true
      - run: uv python install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: dist
      - run: uv venv "$RUNNER_TEMP/xplane-fdau-smoke"
      - run: uv pip install --python "$RUNNER_TEMP/xplane-fdau-smoke/bin/python" dist/xplane_fdau-0.1.0-py3-none-any.whl
      - run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/xplane-fdau-smoke/bin/python" "$GITHUB_WORKSPACE/tools/installed_smoke.py" 0.1.0
