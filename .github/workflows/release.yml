name: release-readiness

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv python install 3.14
      - run: uv sync --frozen --python 3.14
      - run: uv run --python 3.14 python -m unittest discover -v
      - run: uv run --python 3.14 python tools/quality.py check
      - run: uv run --python 3.14 mkdocs build --strict
      - run: uv build --no-sources
      - run: uv tool run twine check --strict dist/*
      - run: uv run --python 3.14 python tools/release.py check-tag "${GITHUB_REF_NAME}"
      - run: uv run --python 3.14 python tools/release.py check-dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: |
            dist/xplane_fdr-0.1.0-py3-none-any.whl
            dist/xplane_fdr-0.1.0.tar.gz
          if-no-files-found: error

  installed-wheel:
    needs: validate-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv python install ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist
      - run: uv venv "$RUNNER_TEMP/xplane-fdr-smoke" --python ${{ matrix.python-version }}
      - run: uv pip install --python "$RUNNER_TEMP/xplane-fdr-smoke/bin/python" dist/xplane_fdr-0.1.0-py3-none-any.whl
      - run: |
          cd "$RUNNER_TEMP"
          source "$RUNNER_TEMP/xplane-fdr-smoke/bin/activate"
          python "$GITHUB_WORKSPACE/tools/installed_smoke.py" 0.1.0

  publish-pypi:
    needs: [validate-release, installed-wheel]
    if: github.ref_type == 'tag' && github.ref_name == 'v0.1.0'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist
      - run: uv publish dist/*
