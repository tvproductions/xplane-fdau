site_name: xplane-fdau
site_description: Virtual FDAU/FDIU tools for X-Plane, including native FDR v3/v4
site_url: https://tvproductions.github.io/xplane-fdau/
repo_url: https://github.com/tvproductions/xplane-fdau
repo_name: tvproductions/xplane-fdau

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]

nav:
  - Overview: index.md
  - Usage:
      - Native FDR: usage/native-fdr.md
  - Reference:
      - Native FDR API: reference/native-fdr.md

validation:
  omitted_files: ignore
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn
