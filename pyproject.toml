[project]
name = "xplane-fdau"
version = "0.1.0"
description = "Standard-library-only Python toolkit for acquiring, normalizing, recording, replaying, and distributing X-Plane flight data, including native FDR v3/v4 support."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Simulation",
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
xplane-fdau = "xplane_fdau.cli:main"

[project.urls]
Homepage = "https://tvproductions.github.io/xplane-fdau/"
Documentation = "https://tvproductions.github.io/xplane-fdau/"
Issues = "https://github.com/tvproductions/xplane-fdau/issues"
Repository = "https://github.com/tvproductions/xplane-fdau"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "cohesion>=1.2.0",
    "coverage>=7.14.1",
    "detect-secrets>=1.5.0",
    "interrogate>=1.7.0",
    "lizard>=1.23.0",
    "mkdocs",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "pre-commit>=4.5.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.17",
    "ty>=0.0.49",
    "vulture>=2.16",
    "wily>=1.12.2",
    "xenon>=0.9.3",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-exclude = [
    ".codex/**",
    ".git/**",
    ".superpowers/**",
    ".ruff_cache/**",
    "docs/superpowers/**",
    "tests/fixtures/fdr/*official*",
]

[tool.coverage.run]
source = ["xplane_fdau"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 160
exclude = [".codex", "docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.rules]
all = "error"
