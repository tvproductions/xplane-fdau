[project]
name = "xplane-fdr"
version = "0.1.0"
description = "A standard-library-only Python toolkit for reading, writing, recording, validating, and converting X-Plane Flight Data Recorder files, independent of how flight data is captured."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Simulation",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://tvproductions.github.io/xplane-fdr/"
Documentation = "https://tvproductions.github.io/xplane-fdr/"
Issues = "https://github.com/tvproductions/xplane-fdr/issues"
Repository = "https://github.com/tvproductions/xplane-fdr"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "cohesion>=1.2.0",
    "coverage>=7.14.1",
    "detect-secrets>=1.5.0",
    "interrogate>=1.7.0",
    "lizard>=1.23.0",
    "mkdocs",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "pre-commit>=4.5.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.17",
    "ty>=0.0.49",
    "vulture>=2.16",
    "wily>=1.12.2",
    "xenon>=0.9.3",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
