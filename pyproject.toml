[project]
name = "xplane-fdau"
version = "0.1.0"
description = "Standard-library-only Python toolkit for acquiring, normalizing, recording, replaying, and distributing X-Plane flight data, including native FDR v3/v4 support."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Simulation",
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
xplane-fdau = "xplane_fdau.cli:main"

[project.urls]
Homepage = "https://tvproductions.github.io/xplane-fdau/"
Documentation = "https://tvproductions.github.io/xplane-fdau/"
Issues = "https://github.com/tvproductions/xplane-fdau/issues"
Repository = "https://github.com/tvproductions/xplane-fdau"

[dependency-groups]
dev = [
    "mkdocs",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "packaging>=25",
    "pre-commit==4.7.0",
    "pyyaml>=6.0.3",
    "ruff==0.17.3",
    "twine>=7.0.0",
    "ty==0.0.94",
    "wily>=1.12.2",
    "xenon>=0.9.3",
]
hygiene = [
    "bandit==1.9.4",
    "cohesion==1.2.0",
    "cosmic-ray==8.7.0",
    "coverage==7.17.0",
    "deptry==0.25.1",
    "detect-secrets==1.5.0",
    "import-linter==2.15",
    "interrogate==1.7.0",
    "lizard==1.24.3",
    "pip-audit==2.10.1",
    "vulture==2.16",
]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.5"
python-preference = "only-managed"
# Official immutable catalog for Python 3.12.16, newer than uv 0.13.5's bundled catalog.
python-downloads-json-url = "https://raw.githubusercontent.com/astral-sh/uv/acee8d938b52225be3e90ccfcbe69fa4eb8ed215/crates/uv-python-managed/download-metadata.json"

[tool.uv.build-backend]
module-root = "src"
source-exclude = [
    ".agents/**",
    ".codex/**",
    ".gz-skills/**",
    ".git/**",
    ".skills-first/**",
    ".superpowers/**",
    ".ruff_cache/**",
    ".import_linter_cache/**",
    "AGENTS.skills-first.md",
    "docs/superpowers/**",
    "tests/fixtures/fdr/*official*",
]

[tool.coverage.run]
source = ["xplane_fdau"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 160
target-version = "py312"
exclude = ["docs/superpowers", ".agents", ".superpowers", ".worktrees", ".venv", "site"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.format]
docstring-code-format = true

[tool.ty.rules]
all = "error"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "tools", ".codex/skills"]

[tool.importlinter]
root_package = "xplane_fdau"

[[tool.importlinter.contracts]]
name = "Canonical contracts remain independent of delivery adapters"
type = "forbidden"
source_modules = ["xplane_fdau.contracts"]
forbidden_modules = ["xplane_fdau.formats", "xplane_fdau.sinks", "xplane_fdau.cli"]

[[tool.importlinter.contracts]]
name = "Formats remain independent of sinks and CLI"
type = "forbidden"
source_modules = ["xplane_fdau.formats"]
forbidden_modules = ["xplane_fdau.sinks", "xplane_fdau.cli"]

[[tool.importlinter.contracts]]
name = "Sinks remain independent of CLI"
type = "forbidden"
source_modules = ["xplane_fdau.sinks"]
forbidden_modules = ["xplane_fdau.cli"]

# Explicit on-demand scope. The adapter supplies an isolated unittest command.
[cosmic-ray]
module-path = ["src/xplane_fdau/contracts/values.py", "src/xplane_fdau/contracts/canonical_json.py", "src/xplane_fdau/contracts/_identity_validation.py"]
timeout = 30

[cosmic-ray.distributor]
name = "local"
